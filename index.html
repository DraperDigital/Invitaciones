<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Invitto — Invitaciones digitales elegantes para bodas, XV años, cumpleaños y más. Crea, comparte y gestiona tus eventos en minutos." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- DNS prefetch for external services -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />

    <!--
      Google Fonts — only load what the app actually uses:
      · Playfair Display: 400 (normal headings), 700 (bold headings)
      · Inter: 300 (font-light), 400 (body), 500 (medium), 600 (semibold), 700 (bold)
      · Cormorant Garamond removed — not referenced anywhere in the codebase
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600;700&family=Libre+Baskerville:wght@400;700&family=Manrope:wght@400;500;600;700&family=Lato:wght@400;700&family=Outfit:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <title>Invitto — Invitaciones Digitales</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
